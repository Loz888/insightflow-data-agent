[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insightflow-data-agent"
version = "0.2.0"
description = "Local enterprise data analysis agent on trusted synthetic data"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "langgraph", "psycopg[binary,pool]", "sqlglot", "pydantic", "pydantic-settings", "httpx", "openai", "prometheus-client", "opentelemetry-api", "opentelemetry-sdk"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: real PostgreSQL queries"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"insightflow.v2" = ["demo.html"]
