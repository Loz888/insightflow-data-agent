groups:
  - name: insightflow-pilot
    rules:
      - alert: InsightFlowDependencyUnavailable
        expr: insightflow_ready == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dependency readiness failed; inspect private diagnostic events
      - alert: InsightFlowScrapeUnavailable
        expr: up{job="insightflow-pilot"} == 0
        for: 1m
        labels:
          severity: warning
