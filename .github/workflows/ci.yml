name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  INSIGHTFLOW_MODE: mock
  INSIGHTFLOW_EXPERIMENT_MODE: full
  INSIGHTFLOW_ENABLE_LIVE: 'false'
  INSIGHTFLOW_ENABLE_PAID_EVAL: '0'
  DEEPSEEK_API_KEY: ''
  LANGSMITH_TRACING: 'false'
jobs:
  unit:
    name: Static and database-independent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Static, compile and dependency checks
        run: |
          .venv/bin/python scripts/scan_secrets.py --mode history
          .venv/bin/ruff check src tests scripts
          .venv/bin/ruff format --check src tests scripts
          .venv/bin/python -m compileall -q src
          .venv/bin/python -m pip check
      - name: Unit tests, rejecting SKIP
        run: |
          .venv/bin/python -m pytest -v -m 'not integration' --evidence-json "$RUNNER_TEMP/unit.json"
          .venv/bin/python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/unit.json")); assert d["passed"]>0 and not any(d[k] for k in ("failed","errors","skipped"))'
  postgres:
    name: PostgreSQL, safety, E2E and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INSIGHTFLOW_CI_ADMIN_DATABASE_URL: postgres://postgres:ci-admin-only@127.0.0.1:5432/postgres?sslmode=disable
      INSIGHTFLOW_CI_OWNER_PASSWORD: ci-owner-only
      INSIGHTFLOW_CI_READER_PASSWORD: ci-reader-only
      INSIGHTFLOW_ADMIN_DATABASE_URL: postgres://insightflow_owner:ci-owner-only@127.0.0.1:5432/insightflow_dev?sslmode=disable
      INSIGHTFLOW_TEST_ADMIN_DATABASE_URL: postgres://insightflow_owner:ci-owner-only@127.0.0.1:5432/insightflow_test?sslmode=disable
      INSIGHTFLOW_DATABASE_URL: postgres://insightflow_reader:ci-reader-only@127.0.0.1:5432/insightflow_dev?sslmode=disable
      INSIGHTFLOW_TEST_DATABASE_URL: postgres://insightflow_reader:ci-reader-only@127.0.0.1:5432/insightflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Initialize only temporary test roles and data
        run: |
          .venv/bin/python scripts/ci_init.py
          ./scripts/init_db.sh
      - name: Full tests, SQL negatives, fault injection and Mock E2E
        run: ./scripts/accept.sh
      - name: Independent evaluation and experiment smoke
        run: |
          .venv/bin/python -m insightflow.evaluation.runner --output "$RUNNER_TEMP/final-evaluation"
          .venv/bin/python -m insightflow.evaluation.ablation --output "$RUNNER_TEMP/ablation"
          .venv/bin/python -m insightflow.evaluation.performance --output "$RUNNER_TEMP/performance" --requests 8
          .venv/bin/python -m insightflow.evaluation.real_model --output "$RUNNER_TEMP/real-not-run"
