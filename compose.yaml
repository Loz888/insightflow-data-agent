services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${INSIGHTFLOW_BOOTSTRAP_PASSWORD:?Run configure_compose.py}
      INSIGHTFLOW_OWNER_PASSWORD: ${INSIGHTFLOW_OWNER_PASSWORD:?}
      INSIGHTFLOW_READER_PASSWORD: ${INSIGHTFLOW_READER_PASSWORD:?}
      INSIGHTFLOW_RUNTIME_PASSWORD: ${INSIGHTFLOW_RUNTIME_PASSWORD:?}
    volumes:
      - insightflow_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/010_roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: [127.0.0.1:8000:8000]
    environment:
      INSIGHTFLOW_ADMIN_DATABASE_URL: host=db dbname=insightflow_dev user=insightflow_owner password=${INSIGHTFLOW_OWNER_PASSWORD}
      INSIGHTFLOW_TEST_ADMIN_DATABASE_URL: host=db dbname=insightflow_test user=insightflow_owner password=${INSIGHTFLOW_OWNER_PASSWORD}
      INSIGHTFLOW_DATABASE_URL: host=db dbname=insightflow_dev user=insightflow_reader password=${INSIGHTFLOW_READER_PASSWORD}
      INSIGHTFLOW_V2_RUNTIME_URL: host=db dbname=insightflow_dev user=insightflow_runtime password=${INSIGHTFLOW_RUNTIME_PASSWORD}
      INSIGHTFLOW_V2_AUTH_TOKENS: ${INSIGHTFLOW_V2_AUTH_TOKENS:?}
      INSIGHTFLOW_V2_MODE: ${INSIGHTFLOW_V2_MODE:-mock}
      INSIGHTFLOW_V2_LIVE_ENABLED: ${INSIGHTFLOW_V2_LIVE_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGSMITH_TRACING: 'false'
volumes:
  insightflow_pg:
